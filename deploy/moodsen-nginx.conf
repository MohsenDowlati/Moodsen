# Moodsen Nginx reverse-proxy configuration
#
# Frontend: http://127.0.0.1:3000
# Backend:  http://127.0.0.1:8000
#
# Public routes:
#   /           -> Next.js
#   /api/...    -> FastAPI, with /api prefix removed

upstream moodsen_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream moodsen_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Replace this with your domain.
    # For an IP-only deployment, use: server_name _;
    serverm moodsen.example.com;

    client_max_body_size 10m;

    # Recommended security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Optional health endpoint.
    location = /health {
        proxy_pass http://moodsen_api/health;
        proxy_http_version 1.1;

        proxy_set_header Hostremotehost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # FastAPI routes.
    #
    # The trailing slash in proxy_pass is intentional:
    #
    #   /api/health
    #
    # becomes:
    #
    #   http://127.0.0.1:8000/health
    #
    location /api/ {
        proxy_pass http://moodsen_api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connections reusable.
        proxy_set_header Connection "";

        # Do not buffer streaming responses such as SSE.
        proxy        chunk off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Useful for notification streams.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Prevent request buffering for streaming-related endpoints.
        proxy_request_buffering off;
    }

    # Exact /api route.
    # This prevents an ambiguous redirect or frontend fallback.
    location = /api {
        return 308 /moodsen_frontend
    location / {
        proxy_pass http://moodsen_frontend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
