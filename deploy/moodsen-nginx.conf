# Moodsen Nginx reverse-proxy configuration
#
# Frontend: http://127.0.0.1:3000  (Next.js)
# Backend:  http://127.0.0.1:8000  (FastAPI)
#
# Public routes:
#   /           -> Next.js
#   /api/...    -> FastAPI, with the /api prefix removed
#   /health     -> FastAPI /health (optional, for load balancers / monitoring)
#
# deploy/setup.sh installs this file to /etc/nginx/sites-available/moodsen and
# rewrites the `server_name` line to the deployment's domain or IP.

# Maps the client's Upgrade header to the correct Connection value so that
# WebSocket upgrades work while normal requests keep the connection alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream moodsen_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream moodsen_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    # If the host has IPv6, you can also add:
    #   listen [::]:80;

    # Replace with your domain (setup.sh does this automatically).
    # For an IP-only deployment, use: server_name _;
    server_name moodsen.example.com;

    client_max_body_size 10m;

    # Recommended security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Optional health endpoint (proxies straight to the API's /health).
    location = /health {
        proxy_pass http://moodsen_api/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # FastAPI routes.
    #
    # The trailing slash in proxy_pass is intentional: it strips the /api
    # prefix, so /api/health becomes http://127.0.0.1:8000/health.
    location /api/ {
        proxy_pass http://moodsen_api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep upstream connections reusable.
        proxy_set_header Connection "";

        # Required for Server-Sent Events (the notification stream):
        # do not buffer, cache, or chunk-transform streaming responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # Handle /api without a trailing slash so it does not fall through to the
    # frontend (which would 404).
    location = /api {
        return 308 /api/;
    }

    # Next.js frontend.
    location / {
        proxy_pass http://moodsen_frontend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (harmless for plain HTTP thanks to the map above).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
