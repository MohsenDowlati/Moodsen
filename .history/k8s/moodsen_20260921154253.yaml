apiVersion: v1
kind: Namespace
metadata:
  name: moodsen
  labels:
    app.kubernetes.io/part-of: moodsen

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: moodsen-ebs-sc
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: moodsen-db-pvc
  namespace: moodsen
  labels:
    app.kubernetes.io/part-of: moodsen
    app.kubernetes.io/component: database
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: moodsen-ebs-sc
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: moodsen-db
  namespace: moodsen
  labels:
    app.kubernetes.io/name: moodsen-db
    app.kubernetes.io/part-of: moodsen
    app.kubernetes.io/component: database
spec:
  serviceName: moodsen-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: moodsen-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moodsen-db
        app.kubernetes.io/part-of: moodsen
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: mariadb
          image: mariadb:10.11
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: moodsen-db-secret
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/mysql
              subPath: mariadata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "mariadb-admin ping -h 127.0.0.1 -u root -p$MARIADB_ROOT_PASSWORD --silent"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "mariadb-admin ping -h 127.0.0.1 -u root -p$MARIADB_ROOT_PASSWORD --silent"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: moodsen-db-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: moodsen-db
  namespace: moodsen
  labels:
    app.kubernetes.io/name: moodsen-db
    app.kubernetes.io/part-of: moodsen
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: moodsen-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodsen-backend
  namespace: moodsen
  labels:
    app.kubernetes.io/name: moodsen-backend
    app.kubernetes.io/part-of: moodsen
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: moodsen-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moodsen-backend
        app.kubernetes.io/part-of: moodsen
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              echo "Waiting for moodsen-db:3306..."
              until nc -z moodsen-db 3306; do
                echo "DB not ready, retrying in 3s..."
                sleep 3
              done
              echo "DB is ready!"
      containers:
        - name: backend
          image: ghcr.io/mohsendowlati/Moodsen/moodsen-backend:75da1da
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - secretRef:
                name: moodsen-db-secret
          env:
            - name: PORT
              value: "5000"
            - name: MARIADB_HOST
              value: "moodsen-db"
            - name: MARIADB_PORT
              value: "3306"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: moodsen-backend
  namespace: moodsen
  labels:
    app.kubernetes.io/name: moodsen-backend
    app.kubernetes.io/part-of: moodsen
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: moodsen-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodsen-frontend
  namespace: moodsen
  labels:
    app.kubernetes.io/name: moodsen-frontend
    app.kubernetes.io/part-of: moodsen
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: moodsen-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moodsen-frontend
        app.kubernetes.io/part-of: moodsen
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: frontend
          image: ghcr.io/mohsendowlati/Moodsen/moodsen-frontend:75da1da
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: moodsen-frontend
  namespace: moodsen
  labels:
    app.kubernetes.io/name: moodsen-frontend
    app.kubernetes.io/part-of: moodsen
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: moodsen-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moodsen-default-deny
  namespace: moodsen
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moodsen-allow-dns
  namespace: moodsen
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moodsen-db-allow-backend-only
  namespace: moodsen
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: moodsen-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: moodsen-backend
      ports:
        - protocol: TCP
          port: 3306

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moodsen-backend-egress-to-db
  namespace: moodsen
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: moodsen-backend
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: moodsen-db
      ports:
        - protocol: TCP
          port: 3306

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moodsen-backend-allow-frontend-only
  namespace: moodsen
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: moodsen-backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: moodsen-frontend
      ports:
        - protocol: TCP
          port: 5000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moodsen-frontend-egress-to-backend
  namespace: moodsen
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: moodsen-frontend
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: moodsen-backend
      ports:
        - protocol: TCP
          port: 5000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moodsen-ingress
  namespace: moodsen
spec:
  rules:
    - host: moodsen.example.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: moodsen-backend
                port:
                  number: 5000
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: moodsen-frontend
                port:
                  number: 80
