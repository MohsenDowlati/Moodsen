name: Moodsen DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
    DOCKER_REGISTRY: ghcr.io
    BACKEND_IMAGE: ghcr.io/${{ github.repository }}/moodsen-backend
    FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/moodsen-frontend

jobs:
    # linting job
    lint:
        name: "Lint code"
        runs-on: ubuntu-latest
        continue-on-error: true
        strategy:
            matrix:
                components: [backend]
        steps: