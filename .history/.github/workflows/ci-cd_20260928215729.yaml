name: Moodsen DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKER_REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/moodsen-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/moodsen-frontend

jobs:
  # ---------------------------------------------------------------------------
  # 1. Static Code Analysis & Linting
  # ---------------------------------------------------------------------------
  lint-backend:
    name: Backend Lint (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back-end

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: back-end/requirements.txt

      - name: Install dependencies & lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff (Linter & Format Check)
        run: |
          ruff check .
          ruff format --check .
      - name: Run Type Checking (Mypy)
        run: |
          mypy .

  lint-frontend:
    name: Frontend Lint (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front-end

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js ESLint
        run: npm run lint

      - name: Run TypeScript Check
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # 2. Software Composition Analysis (SCA)
  # ---------------------------------------------------------------------------
  sca-backend:
    name: Backend SCA (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back-end

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: back-end/requirements.txt

      - name: Install dependencies & pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pip-audit
        run: |
          pip-audit

  sca-frontend:
    name: Frontend SCA (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front-end

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front-end/package-lock.json

      - name: Run npm audit
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # 3. Infrastructure as Code (IaC) & Dockerfile Linting
  # ---------------------------------------------------------------------------
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [back-end, front-end]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./${{ matrix.component }}/Dockerfile
          failure-threshold: warning

  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        if: hashFiles('terraform/**') != ''
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          skip_check: CKV_AWS_39,CKV_AWS_58
          output_format: cli

      - name: Run Checkov on Kubernetes manifests
        if: hashFiles('k8s/**') != ''
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true
          output_format: cli

  # ---------------------------------------------------------------------------
  # 4. Container Build & Push
  # ---------------------------------------------------------------------------
  build:
    name: "Build & Push ${{ matrix.component.name }}"
    runs-on: ubuntu-latest
    needs:
      - lint-backend
      - lint-frontend
      - sca-backend
      - sca-frontend
      - dockerfile-lint
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component:
          - name: backend
            path: back-end
          - name: frontend
            path: front-end
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/moodsen-${{ matrix.component.name }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component.path }}
          file: ./${{ matrix.component.path }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ---------------------------------------------------------------------------
  # 5. Container Image Vulnerability Scanning
  # ---------------------------------------------------------------------------
  image-scan:
    name: "Scan ${{ matrix.component.name }} Image"
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        component:
          - name: backend
            path: back-end
          - name: frontend
            path: front-end
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image locally for scanning
        run: |
          docker build -t moodsen-${{ matrix.component.name }}:scan ./${{ matrix.component.path }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "moodsen-${{ matrix.component.name }}:scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          timeout: "10m"

  # ---------------------------------------------------------------------------
  # 6. GitOps / Update Kubernetes Manifests
  # ---------------------------------------------------------------------------
  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    needs:
      - build
      - image-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update K8s manifest with new image tags
        env:
          BACKEND_IMG: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMG: ${{ env.FRONTEND_IMAGE }}
          IMAGE_TAG: ${{ steps.sha.outputs.short }}
        run: |
          echo "Updating to tag: ${IMAGE_TAG}"

          # Locate line numbers in k8s/moodsen.yaml
          BACKEND_LINE=$(awk '/- name: backend/{found=1} found && /image:/{print NR; exit}' k8s/moodsen.yaml)
          FRONTEND_LINE=$(awk '/- name: frontend/{found=1} found && /image:/{print NR; exit}' k8s/moodsen.yaml)

          if [ -z "$BACKEND_LINE" ] || [ -z "$FRONTEND_LINE" ]; then
            echo "❌ Failed to locate backend or frontend image lines in k8s/moodsen.yaml"
            exit 1
          fi

          echo "Updating Backend at line: ${BACKEND_LINE}"
          sed -i "${BACKEND_LINE}s|.*|          image: ${BACKEND_IMG}:${IMAGE_TAG}|" k8s/moodsen.yaml

          echo "Updating Frontend at line: ${FRONTEND_LINE}"
          sed -i "${FRONTEND_LINE}s|.*|          image: ${FRONTEND_IMG}:${IMAGE_TAG}|" k8s/moodsen.yaml

          echo "✅ Final image definitions:"
          grep -n "image:" k8s/moodsen.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/moodsen.yaml
          git diff --cached --quiet || git commit -m "ci: update k8s images to ${{ steps.sha.outputs.short }} [skip ci]"
          git push
