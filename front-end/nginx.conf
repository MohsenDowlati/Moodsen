# Moodsen frontend reverse proxy
#
# Next.js: 127.0.0.1:3000
# FastAPI: 127.0.0.1:8000
#
# Public:
#   /        -> Next.js
#   /api/... -> FastAPI

upstream moodsen_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream moodsen_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your real domain.
    # For an IP-only deployment, use: server_name _;
    server_name moodsen.example.com;

    client_max_body_size 10m;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # FastAPI API routes.
    #
    # The trailing slash on proxy_pass removes /api:
    #
    #   /api/health -> backend /health
    #
    location /api/ {
        proxy_pass http://moodsen_api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep HTTP/1.1 connections alive.
        proxy_set_header Connection "";

        # Required for Server-Sent Events.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # Handle /api without a trailing slash.
    location = /api {
        return 308 /api/;
    }

    # Next.js frontend.
    location / {
        proxy_pass http://moodsen_frontend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
